<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveKadeh SSH & SFTP Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-glow">⚡</div>
        <div>
          <h1 class="title">LiveKadeh</h1>
          <span class="subtitle">SSH & SFTP Pro</span>
        </div>
      </div>
      <div style="display: flex; gap: 6px;">
        <button id="btnOpenWindow" class="btn-icon" title="Open in Standalone App Window" data-i18n-title="nav_standalone_window">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>
        <button id="btnOpenFull" class="btn-icon" title="Open in Full Tab">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Quick Server Connect Bar -->
    <div class="quick-connect-card">
      <div class="card-title" data-i18n="popup_quick_connect">Quick Connect to Server</div>
      <div class="form-row">
        <input type="text" id="quickHost" placeholder="Server IP or Host (e.g. 192.168.1.100)" data-i18n-placeholder="popup_host_placeholder" dir="ltr">
      </div>
      <div class="form-grid">
        <input type="text" id="quickUser" placeholder="User (e.g. root)" data-i18n-placeholder="popup_user_placeholder" value="root" dir="ltr">
        <input type="number" id="quickPort" placeholder="Port (22)" data-i18n-placeholder="popup_port_placeholder" value="22" dir="ltr">
      </div>
      <div class="form-row">
        <input type="password" id="quickPass" placeholder="Password or key" data-i18n-placeholder="popup_pass_placeholder" dir="ltr">
      </div>
      <div class="action-buttons">
        <button id="btnQuickSSH" class="btn btn-primary">
          <span>⚡ SSH Terminal</span>
        </button>
        <button id="btnQuickSFTP" class="btn btn-secondary">
          <span>📁 SFTP Manager</span>
        </button>
      </div>
    </div>

    <!-- Saved Servers List -->
    <div class="saved-servers-section">
      <div class="section-header">
        <span data-i18n="popup_saved_servers">Saved Servers</span>
        <button id="btnManageServers" class="link-btn" data-i18n="popup_manage">Manage +</button>
      </div>
      <div id="serversList" class="servers-list">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- Footer Bridge Status -->
    <footer class="footer">
      <div class="bridge-status">
        <span class="status-dot" id="bridgeDot"></span>
        <span id="bridgeStatusText" data-i18n="popup_bridge_checking">Bridge: Checking...</span>
      </div>
      <button id="btnSettings" class="btn-icon" title="Settings">⚙️</button>
    </footer>
  </div>

  <script src="lib/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
